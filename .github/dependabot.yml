version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 5
    groups:
      # react and react-dom have a peer dependency on each other. Bumping one
      # without the other produces an ERESOLVE failure that looks like an
      # incompatibility but is only a grouping mistake.
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      other:
        patterns: ["*"]
        exclude-patterns: ["react", "react-dom", "@types/react*", "vite", "@vitejs/*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    groups:
      actions:
        patterns: ["*"]
