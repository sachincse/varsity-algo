name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # The engine must be importable and the app must construct without any
      # credentials at all — that is the whole promise of "no keys needed to
      # scan", and it is easy to break by moving a config read to import time.
      - name: App boots with no credentials
        env:
          KITE_API_KEY: ""
          KITE_API_SECRET: ""
          ANTHROPIC_API_KEY: ""
        run: |
          python -c "import sys; sys.path.insert(0,'.'); from server.main import app; print('app ok')"
          python -c "import sys; sys.path.insert(0,'.'); from core.spec import VARSITY_DEFAULT as v; print(v.describe())"

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Check the build produced something
        working-directory: web
        run: test -f dist/index.html
